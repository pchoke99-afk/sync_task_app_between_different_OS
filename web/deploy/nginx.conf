worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_header_timeout 10s;
    client_body_timeout 15s;
    keepalive_timeout 15s;
    client_max_body_size 16k;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    proxy_connect_timeout 10s;
    proxy_read_timeout 510s;
    proxy_send_timeout 20s;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 127.0.0.1:8081;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; connect-src 'self' https://accounts.google.com/gsi/ https://oauth2.googleapis.com https://www.googleapis.com; img-src 'self' blob: data:; worker-src 'self'; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control no-cache always;

        # One origin: browser clients never need cross-origin access to private ports.
        # Limit PocketBase forwarding to the existing user/task API, excluding admin UI.
        location ~ ^/pb/api/collections/(users/(auth-with-password|auth-refresh)|tasks/records(/[a-z0-9]{15})?)$ {
            if ($request_method !~ ^(GET|POST|PATCH|DELETE)$) { return 405; }
            rewrite ^/pb/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:8090;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $proxy_host;
            proxy_hide_header Access-Control-Allow-Origin;
        }
        location /pb/ { return 404; }
        location ~ ^/ai/(health|chat|conversations(/[a-f0-9]{32})?|proposals/[A-Za-z0-9_-]{32}/decision)$ {
            if ($request_method !~ ^(GET|POST)$) { return 405; }
            rewrite ^/ai/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $proxy_host;
        }
        location /ai/ { return 404; }
        location ~ (^|/)\. { return 404; }
        location / {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            try_files $uri $uri/ =404;
        }
    }
}
